name: "Build and test"
on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.features }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        features: [default, minimal, invidious]
        include:
          - features: default
            args: ""
          - features: minimal
            args: --no-default-features --features rustypipe
          - features: invidious
            args: --no-default-features --features rustypipe,invidious
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libmpv-dev libxcb1-dev libx11-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install mpv yt-dlp pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check
        run: cargo check --locked ${{ matrix.args }}

      - name: Test
        run: cargo test --locked ${{ matrix.args }}

      - name: Build
        run: cargo build --locked ${{ matrix.args }}
